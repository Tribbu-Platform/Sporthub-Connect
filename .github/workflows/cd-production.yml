name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"

jobs:
  # ============================================================
  # Build & Push Production Images
  # ============================================================
  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag or commit
        id: version
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -match "^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)") {
            echo "version=$($matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            echo "version=latest" >> $env:GITHUB_OUTPUT
          }

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.api
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/api:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: frontend/sport-hub-web
          file: frontend/sport-hub-web/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/web:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Deploy to Production
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://app.sporthub.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment"
          # az containerapp update --name sporthub-api-prod \
          #   --resource-group sporthub-prod-rg \
          #   --image ghcr.io/${{ github.repository }}/api:production
          # az containerapp update --name sporthub-web-prod \
          #   --resource-group sporthub-prod-rg \
          #   --image ghcr.io/${{ github.repository }}/web:production

  # ============================================================
  # Create Release
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
