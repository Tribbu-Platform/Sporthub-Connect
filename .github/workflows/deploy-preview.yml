# ===================================================================
# SportHub Connect — Preview Environment Deployment (ACA)
# ===================================================================
# Crea/destruye entornos de preview aislados en Azure Container Apps
# por cada rama hu/*. Cada preview recibe su propio par de Container
# Apps (API + Web) compartiendo el mismo ACA Environment de staging.
#
# ADR-005: Azure Container Apps como plataforma unica de despliegue.
# Section 10: Preview environments design in architecture.md.
#
# Flujo:
#   1. Push a hu/* → Build Docker images + push a GHCR + deploy ACA
#   2. Push a hu/* (update) → Update existing Container Apps
#   3. PR closed → Destroy preview environment
# ===================================================================

name: Deploy Preview (ACA)

# CI + Deploy integrados en un solo workflow secuencial.
# CI corre primero; deploy solo si CI pasa.
on:
  push:
    branches: ["hu/**"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ["develop", "feature/*"]

# Evita despliegues concurrentes en la misma rama
concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # ─── Container Registry (GHCR) ───────────────────────────────
  REGISTRY: ghcr.io
  # IMAGE_NAME_API y IMAGE_NAME_WEB se definen en el job sanitize

  # ─── Azure ───────────────────────────────────────────────────
  AZURE_RESOURCE_GROUP: rg-sporthub-staging
  AZURE_CONTAINER_APP_ENV: cae-sport-staging

  # ─── Preview naming ──────────────────────────────────────────
  # Sanitiza el nombre de rama para usar como sufijo de recursos
  # Ej: "hu/F001-US-001-registro-google-oauth2" → "hu-f001-us-001"

jobs:
  # ================================================================
  # Job 1: Sanitize branch name
  # ================================================================
  sanitize:
    name: Sanitize branch name
    runs-on: ubuntu-latest
    outputs:
      branch_safe: ${{ steps.sanitize.outputs.branch_safe }}
      image_tag: ${{ steps.sanitize.outputs.image_tag }}
      image_name_api: ${{ steps.sanitize.outputs.image_name_api }}
      image_name_web: ${{ steps.sanitize.outputs.image_name_web }}

    steps:
      - name: Wait for CI to pass
        id: wait-for-ci
        shell: bash
        run: |
          COMMIT="${{ github.sha }}"
          echo "Waiting for CI workflow (ci.yml) to pass on commit $COMMIT..."
          for i in $(seq 1 180); do
            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=${{ github.event_name }}&per_page=1" \
              --jq '.workflow_runs[0].conclusion' 2>/dev/null || echo "")
            if [ "$CONCLUSION" = "success" ]; then
              echo "CI passed!"
              exit 0
            fi
            if [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ] || [ "$CONCLUSION" = "timed_out" ]; then
              echo "CI failed: $CONCLUSION"
              exit 1
            fi
            if [ -z "$CONCLUSION" ] || [ "$CONCLUSION" = "null" ]; then
              echo "CI workflow not found yet or still running... attempt $i/180"
            else
              echo "CI status: $CONCLUSION... attempt $i/180"
            fi
            sleep 10
          done
          echo "CI did not complete within 30 minutes"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sanitize branch name for Azure naming
        id: sanitize
        shell: bash
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Original branch: $BRANCH"

          # Lowercase repo name (Docker requires lowercase)
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Lowercase repo: $REPO_LC"

          # Convertir a lowercase, reemplazar / por -, quitar caracteres especiales
          SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/[^a-z0-9-]//g' | cut -c1-32)
          echo "Sanitized branch: $SAFE"

          # Generar image tag: preview-{branch_safe}-{sha}
          TAG="preview-${SAFE}-${{ github.sha }}"
          echo "Image tag: $TAG"

          echo "branch_safe=$SAFE" >> $GITHUB_OUTPUT
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "image_name_api=${REPO_LC}/api" >> $GITHUB_OUTPUT
          echo "image_name_web=${REPO_LC}/web" >> $GITHUB_OUTPUT

  # ================================================================
  # Job 2: Build & Push Docker Images
  # ================================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [sanitize]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Login to GHCR ──────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PASSWORD || github.token }}
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & Push API ──────────────────────────────────────
      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.api
          target: production
          push: ${{ secrets.GHCR_PASSWORD != '' }}
          load: ${{ secrets.GHCR_PASSWORD == '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_api }}:${{ needs.sanitize.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_api }}:preview-${{ needs.sanitize.outputs.branch_safe }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_api }}:preview-${{ needs.sanitize.outputs.branch_safe }}
            type=registry,ref=${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_api }}:main
            type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.branch=${{ github.head_ref || github.ref_name }}

      # ── Build & Push Web ──────────────────────────────────────
      - name: Build & Push Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend/sport-hub-web
          file: frontend/sport-hub-web/Dockerfile
          target: production
          push: ${{ secrets.GHCR_PASSWORD != '' }}
          load: ${{ secrets.GHCR_PASSWORD == '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_web }}:${{ needs.sanitize.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_web }}:preview-${{ needs.sanitize.outputs.branch_safe }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_web }}:preview-${{ needs.sanitize.outputs.branch_safe }}
            type=registry,ref=${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_web }}:main
            type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.branch=${{ github.head_ref || github.ref_name }}

      # ── Smoke test ─────────────────────────────────────────────
      - name: Smoke test API image
        run: |
          docker run -d --name preview-api-test -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Preview \
            -e ASPNETCORE_URLS=http://+:8080 \
            ${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_api }}:${{ needs.sanitize.outputs.image_tag }}
          sleep 5
          curl -f http://localhost:8080/health || (docker logs preview-api-test && exit 1)
          echo "API health check passed!"
          docker stop preview-api-test && docker rm preview-api-test

      - name: Smoke test Web image
        run: |
          docker run -d --name preview-web-test -p 3000:3000 \
            -e NODE_ENV=production \
            -e NEXT_TELEMETRY_DISABLED=1 \
            ${{ env.REGISTRY }}/${{ needs.sanitize.outputs.image_name_web }}:${{ needs.sanitize.outputs.image_tag }}
          sleep 5
          curl -f http://localhost:3000/api/health || (docker logs preview-web-test && exit 1)
          echo "Web health check passed!"
          docker stop preview-web-test && docker rm preview-web-test

  # ================================================================
  # Job 3: Deploy Preview to ACA
  # ================================================================
  deploy:
    name: Deploy Preview (ACA)
    runs-on: ubuntu-latest
    needs: [sanitize, build]
    if: >
      (github.event_name == 'push' || 
       (github.event_name == 'pull_request' && github.event.action != 'closed'))
    timeout-minutes: 15

    steps:
      - name: Check if Azure credentials are set
        id: check_secrets
        shell: bash
        run: |
          if [[ "${{ secrets.AZURE_CREDENTIALS }}" == "" ]]; then
            echo "AZURE_CREDENTIALS not set — skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_secrets.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Log in to Azure
        if: steps.check_secrets.outputs.skip != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to GHCR (Azure deployment)
        if: steps.check_secrets.outputs.skip != 'true'
        uses: azure/container-apps-deploy-action@v1
        with:
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ github.repository_owner }}
          registryPassword: ${{ secrets.GHCR_PASSWORD }}

      - name: Deploy API Container App
        if: steps.check_secrets.outputs.skip != 'true'
        shell: pwsh
        run: |
          $branchSafe = "${{ needs.sanitize.outputs.branch_safe }}"
          $imageTag = "${{ needs.sanitize.outputs.image_tag }}"

          & "${{ github.workspace }}/infrastructure/deploy-preview.ps1" `
            -Action create `
            -BranchName $branchSafe `
            -ImageTag $imageTag `
            -ResourceGroup "${{ env.AZURE_RESOURCE_GROUP }}" `
            -EnvironmentName "${{ env.AZURE_CONTAINER_APP_ENV }}"
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}

      - name: Wait for health checks
        if: steps.check_secrets.outputs.skip != 'true'
        shell: bash
        run: |
          BRANCH_SAFE="${{ needs.sanitize.outputs.branch_safe }}"
          API_NAME="ca-preview-${BRANCH_SAFE}-api"
          WEB_NAME="ca-preview-${BRANCH_SAFE}-web"

          # Obtener FQDNs
          API_FQDN=$(az containerapp show --name "$API_NAME" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          WEB_FQDN=$(az containerapp show --name "$WEB_NAME" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)

          echo "Waiting for API health check (max 3 min)..."
          for i in $(seq 1 18); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${API_FQDN}/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "API is healthy!"
              break
            fi
            echo "Attempt $i: API returned $HTTP_CODE, waiting 10s..."
            sleep 10
          done

          echo "Waiting for Web health check (max 3 min)..."
          for i in $(seq 1 18); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${WEB_FQDN}/api/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Web is healthy!"
              break
            fi
            echo "Attempt $i: Web returned $HTTP_CODE, waiting 10s..."
            sleep 10
          done

          # Set outputs for PR comment
          echo "API_URL=https://${API_FQDN}" >> $GITHUB_ENV
          echo "WEB_URL=https://${WEB_FQDN}" >> $GITHUB_ENV

      - name: Comment PR with preview URLs
        if: steps.check_secrets.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## ✅ Preview Environment Deployed',
              '',
              `**Branch:** \`${{ github.head_ref }}\``,
              `**Image tag:** \`${{ needs.sanitize.outputs.image_tag }}\``,
              '',
              '| Service | URL |',
              '|---------|-----|',
              `| **API** | [${process.env.API_URL}](${process.env.API_URL}) |`,
              `| **Web** | [${process.env.WEB_URL}](${process.env.WEB_URL}) |`,
              `| **Swagger** | [${process.env.API_URL}/swagger](${process.env.API_URL}/swagger) |`,
              '',
              '> ⏱️ Preview auto-scales to 0 after 5 min idle. Cold start may take ~10-30s.',
              '> 🗑️ Preview will be destroyed when this PR is closed/merged.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const previewComment = comments.find(c => c.body.includes('Preview Environment Deployed'));
            if (previewComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previewComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # ================================================================
  # Job 4: Destroy Preview on PR close
  # ================================================================
  destroy:
    name: Destroy Preview
    runs-on: ubuntu-latest
    needs: [sanitize]
    if: >
      github.event_name == 'pull_request' && github.event.action == 'closed'
    timeout-minutes: 10

    steps:
      - name: Check if Azure credentials are set
        id: check_secrets
        shell: bash
        run: |
          if [[ "${{ secrets.AZURE_CREDENTIALS }}" == "" ]]; then
            echo "AZURE_CREDENTIALS not set — skipping destroy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_secrets.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Log in to Azure
        if: steps.check_secrets.outputs.skip != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Destroy preview infrastructure
        if: steps.check_secrets.outputs.skip != 'true'
        shell: pwsh
        run: |
          $branchSafe = "${{ needs.sanitize.outputs.branch_safe }}"

          & "${{ github.workspace }}/infrastructure/deploy-preview.ps1" `
            -Action destroy `
            -BranchName $branchSafe `
            -ResourceGroup "${{ env.AZURE_RESOURCE_GROUP }}" `
            -EnvironmentName "${{ env.AZURE_CONTAINER_APP_ENV }}"

      - name: Comment PR with destruction notice
        if: steps.check_secrets.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 🗑️ Preview Environment Destroyed',
              '',
              `**Branch:** \`${{ github.head_ref }}\``,
              '',
              'The preview environment has been destroyed.',
              'Container Apps and associated resources have been removed.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
