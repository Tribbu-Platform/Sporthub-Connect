# ===================================================================
# SportHub Connect — CI Pipeline
# ===================================================================
permissions:
  contents: read
  security-events: write
# Ejecuta build + test + code analysis en PRs hacia develop y main,
# y en pushes directos a ramas feature/* y develop.
#
# Stack:
#   - Backend: .NET 10, ASP.NET Core Minimal API
#   - Frontend: Next.js 16, React 19, TypeScript, Tailwind CSS v4
#
# Fases:
#   1. Backend Build + Test + Publish
#   2. Frontend Build + Lint + Type-Check + Test
#   3. Docker Image Build (verification only, no push)
#   4. SAST / Dependency Scan
# ===================================================================

name: CI

on:
  pull_request:
    branches: [develop, main, "feature/*", "hu/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "infrastructure/bicep/**"
  push:
    branches: [develop, "feature/*", "hu/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "infrastructure/bicep/**"

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ================================================================
  # Job 1: Backend — Build, Test, Publish
  # ================================================================
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sporthub
          POSTGRES_PASSWORD: sporthub_dev
          POSTGRES_DB: sporthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sporthub -d sporthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/Api/SportHub.Api/SportHub.Api.csproj
        working-directory: ${{ github.workspace }}

      - name: Run unit tests (build + test)
        run: >
          dotnet test src/Api/SportHub.Api/SportHub.Api.csproj
          -c Release
          --filter "Category=Unit"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
        working-directory: ${{ github.workspace }}
        continue-on-error: false

      - name: Run integration tests (build + test)
        run: >
          dotnet test src/Api/SportHub.Api/SportHub.Api.csproj
          -c Release
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        env:
          ConnectionStrings__PostgreSQL: "Host=localhost;Port=5432;Database=sporthub;Username=sporthub;Password=sporthub_dev"
          ConnectionStrings__Redis: "localhost:6379"
          ConnectionStrings__RabbitMQ: "amqp://sporthub:sporthub_dev@localhost:5672"

      - name: Publish (Release)
        run: dotnet publish src/Api/SportHub.Api/SportHub.Api.csproj -c Release -o ./publish --no-restore
        working-directory: ${{ github.workspace }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish
          retention-days: 3

  # ================================================================
  # Job 2: Frontend — Build, Lint, Type-Check, Test
  # ================================================================
  frontend:
    name: Frontend (Next.js 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/sport-hub-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/sport-hub-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm run test
        env:
          CI: true

      - name: Build (standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Upload .next artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/sport-hub-web/.next
          retention-days: 3

  # ================================================================
  # Job 3: Docker Image Build Verification
  # ================================================================
  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.api
          target: production
          push: false
          load: true
          tags: sporthub/api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test API image (smoke test)
        run: |
          docker run -d --name sporthub-api-test -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ASPNETCORE_URLS=http://+:8080 \
            sporthub/api:ci-test
          sleep 5
          curl -f http://localhost:8080/health || (docker logs sporthub-api-test && exit 1)
          echo "API health check passed!"
          docker stop sporthub-api-test
          docker rm sporthub-api-test

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend/sport-hub-web
          file: frontend/sport-hub-web/Dockerfile
          target: production
          push: false
          load: true
          tags: sporthub/web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Web image (smoke test)
        run: |
          docker run -d --name sporthub-web-test -p 3000:3000 \
            -e NODE_ENV=production \
            -e NEXT_TELEMETRY_DISABLED=1 \
            sporthub/web:ci-test
          sleep 5
          curl -f http://localhost:3000/api/health || (docker logs sporthub-web-test && exit 1)
          echo "Web health check passed!"
          docker stop sporthub-web-test
          docker rm sporthub-web-test

  # ================================================================
  # Job 4: Security & Quality Scans
  # ================================================================
  security:
    name: Security & Quality Scans
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Dependency Scan (Trivy) ────────────────────────────────
      - name: Run Trivy vulnerability scanner (fs)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v /tmp/trivy-cache:/root/.cache/trivy \
            aquasec/trivy:latest \
            filesystem --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed \
            /workspace
        continue-on-error: true

      # ── SAST (CodeQL) ──────────────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript, typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:codeql"

      # ── Secrets scan (GitGuardian / Gitleaks) ─────────────────
      - name: Run Gitleaks secrets scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
