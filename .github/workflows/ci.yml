# ============================================================
# CI — SportHub Connect
#
# Ejecuta el quality gate completo (build, test, lint, SCA),
# construye imágenes Docker y las publica en GHCR.
#
# Al finalizar exitosamente, el workflow `deploy.yml` se
# activa automáticamente vía `workflow_run`.
# ============================================================

name: CI

on:
  push:
    branches: [master, develop, 'release/*']
  pull_request:
    branches: [master, develop]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_API: ghcr.io/${{ github.repository }}/api
  GHCR_IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  # ============================================================
  # BACKEND — .NET 10
  # ============================================================
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      # --- 1. Formateo ---
      - name: Code Format Check (dotnet format)
        run: dotnet format --verify-no-changes --severity error

      # --- 2. Build con Roslyn + SonarAnalyzer ---
      - name: Build
        run: dotnet build --no-restore -warnaserror

      # --- 3. Tests ---
      - name: Run Tests
        run: dotnet test --no-build --configuration Debug --verbosity normal

      # --- 4. SCA — Dependencias vulnerables ---
      - name: SCA — NuGet Vulnerabilities
        run: dotnet list package --vulnerable
        continue-on-error: true

  # ============================================================
  # FRONTEND — Next.js 16 / React 19 / TypeScript
  # ============================================================
  frontend:
    name: Frontend (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/sport-hub-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/sport-hub-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --- 1. Lint ---
      - name: Lint (ESLint)
        run: npm run lint

      # --- 2. TypeScript Check ---
      - name: TypeScript Check
        run: npm run type-check

      # --- 3. Tests ---
      - name: Run Tests (Vitest)
        run: npm test

      # --- 4. SCA — npm audit ---
      - name: SCA — npm Vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================================
  # DOCKER BUILD — Construye y publica imágenes
  # ============================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Solo publica en push a branches principales (no en PRs)
    if: >
      github.event_name == 'push' &&
      (github.ref_name == 'master' || github.ref_name == 'develop' || startsWith(github.ref_name, 'release/'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_API }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}

      - name: Generate Docker metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_WEB }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- API ---
      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.api
          target: production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Web ---
      - name: Build & Push Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend/sport-hub-web
          file: frontend/sport-hub-web/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
