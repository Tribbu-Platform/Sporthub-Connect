name: SportHub Connect CI

on:
  push:
    branches: [develop, 'feature/**', 'hu/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"

jobs:
  # ============================================================
  # .NET Build & Test
  # ============================================================
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sporthub
          POSTGRES_PASSWORD: sporthub_test
          POSTGRES_DB: sporthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: sporthub
          RABBITMQ_DEFAULT_PASS: sporthub_test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~UnitTests" --logger "trx;LogFileName=unit-tests.trx"

      - name: Run Integration Tests
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~IntegrationTests" --logger "trx;LogFileName=integration-tests.trx"
        env:
          ConnectionStrings__PostgreSQL: "Host=localhost;Port=5432;Database=sporthub_test;Username=sporthub;Password=sporthub_test"
          ConnectionStrings__Redis: "localhost:6379"
          ConnectionStrings__RabbitMQ: "amqp://sporthub:sporthub_test@localhost:5672"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  # ============================================================
  # .NET Code Quality
  # ============================================================
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: .NET Format Check
        run: dotnet format whitespace --verify-no-changes --verbosity diagnostic

      - name: Restore dotnet tools
        run: dotnet tool restore || true

      - name: Security Scan
        run: dotnet list package --vulnerable

  # ============================================================
  # Architecture Tests
  # ============================================================
  test-architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Architecture Tests
        run: dotnet test --filter "FullyQualifiedName~Architecture" || echo "Architecture tests skipped (not yet implemented)"

  # ============================================================
  # Frontend Build & Test
  # ============================================================
  build-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/sport-hub-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/sport-hub-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check || npx tsc --noEmit

      - name: Run unit tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

  # ============================================================
  # Docker Build Check
  # ============================================================
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.api
          target: production
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend/sport-hub-web
          file: frontend/sport-hub-web/Dockerfile
          target: production
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
