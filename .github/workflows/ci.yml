name: CI/CD — SportHub Web Frontend

on:
  push:
    branches:
      - 'feature/**'
      - 'hu/**'
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WORKING_DIR: frontend/sport-hub-web

jobs:
  # ==========================================================================
  # Stage 1: Build — Compiles the Next.js application
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cache build artifacts
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORKING_DIR }}/.next
          key: next-build-${{ github.sha }}

  # ==========================================================================
  # Stage 2: Test — Unit tests (Vitest) + TypeScript check + lint
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies (clean)
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Vitest (unit tests)
        run: npx vitest run --reporter=verbose

      - name: Upload Vitest coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: ${{ env.WORKING_DIR }}/coverage/

  # ==========================================================================
  # Stage 3: E2E Tests — Playwright + BDD (Cucumber.js)
  # ==========================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npx playwright test

      - name: BDD tests (Cucumber.js)
        run: npm run test:bdd

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ${{ env.WORKING_DIR }}/playwright-report/

  # ==========================================================================
  # Stage 4: Security Scan — npm audit + dependency review
  # ==========================================================================
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies (clean)
        run: npm ci

      - name: npm audit (critical & high)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true

  # ==========================================================================
  # Stage 5: Container Build — Docker image
  # ==========================================================================
  container:
    name: Container Build
    runs-on: ubuntu-latest
    needs: [test, e2e, scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (sanity check)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.WORKING_DIR }}
          push: false
          load: true
          tags: sporthub-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
