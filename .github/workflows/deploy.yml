# ============================================================
# Deploy — SportHub Connect
#
# Se activa SOLO cuando el workflow `CI` finaliza exitosamente.
# Determina el ambiente según la rama:
#   - develop / release/*  → Staging
#   - main                 → Production
#
# KILL-SWITCH: Variable de repositorio DEPLOY_AZURE_ENABLED
#   - 'false'  → deshabilita TODOS los despliegues a Azure (staging/prod/release)
#   - ausente o cualquier otro valor → despliegues habilitados (default)
#   Configurar en: GitHub → Settings → Secrets and variables → Actions → Variables
#
# NOTA: Las imágenes Docker ya fueron construidas y publicadas
# en GHCR por el workflow CI. Este workflow solo actualiza las
# Container Apps con el tag correspondiente.
# ============================================================

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
      - develop
      - 'release/*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'

env:
  GHCR_REGISTRY: ghcr.io
  RESOURCE_GROUP_STAGING: rg-sporthub-staging
  RESOURCE_GROUP_PRODUCTION: rg-sporthub-production

jobs:
  # ============================================================
  # Gate: Verificar que CI pasó (solo para workflow_run)
  # ============================================================
  gate:
    name: Verify CI Success
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      head_branch: ${{ steps.check.outputs.head_branch }}
      environment: ${{ steps.check.outputs.environment }}
      image_tag: ${{ steps.check.outputs.image_tag }}
      repo_lowercase: ${{ steps.check.outputs.repo_lowercase }}
    steps:
      - name: Check CI conclusion (workflow_run)
        id: check
        shell: bash
        run: |
          # ============================================
          # KILL-SWITCH: DEPLOY_AZURE_ENABLED (repo var)
          # ============================================
          if [[ "${{ vars.DEPLOY_AZURE_ENABLED }}" == "false" ]]; then
            echo "⏸️ Azure deploy DISABLED via DEPLOY_AZURE_ENABLED=false"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — skipping CI gate"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"

          echo "CI workflow concluded with: $CONCLUSION"
          echo "Branch: $HEAD_BRANCH"
          echo "Commit: $HEAD_SHA"

          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ CI no pasó (conclusion=$CONCLUSION). Cancelando deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determinar ambiente según la rama
          case "$HEAD_BRANCH" in
            develop)
              ENVIRONMENT="staging"
              ;;
            release/*)
              ENVIRONMENT="staging"
              ;;
            master)
              ENVIRONMENT="production"
              ;;
            *)
              echo "Rama no desplegable: $HEAD_BRANCH"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Generar image tag: CI usa formato {branch}-{short_sha}
          SHORT_SHA="${HEAD_SHA:0:7}"
          SAFE_BRANCH=$(echo "$HEAD_BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          IMAGE_TAG="${SAFE_BRANCH}-${SHORT_SHA}"

          echo "✅ CI pasó. Desplegando a $ENVIRONMENT con tag $IMAGE_TAG"

          # Lowercase repo for Docker (Docker requires lowercase)
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lowercase=$REPO_LC" >> "$GITHUB_OUTPUT"

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ============================================================
  # STAGING — develop / release/*
  # ============================================================
  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.should_deploy == 'true' && needs.gate.outputs.environment == 'staging'

    environment:
      name: staging
      url: https://ca-sport-staging-api.${{ vars.STAGING_REGION || 'eastus' }}.azurecontainerapps.io

    concurrency: staging

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING || secrets.AZURE_CREDENTIALS }}

      - name: Deploy API — Update Container App
        shell: bash
        run: |
          echo "🚀 Deploying API to staging..."
          az containerapp update \
            --name "ca-sport-staging-api" \
            --resource-group "${{ env.RESOURCE_GROUP_STAGING }}" \
            --image "${{ env.GHCR_REGISTRY }}/${{ needs.gate.outputs.repo_lowercase }}/api:${{ needs.gate.outputs.image_tag }}" \
            --output table
          echo "✅ API updated to tag: ${{ needs.gate.outputs.image_tag }}"

      - name: Deploy Web — Update Container App
        shell: bash
        run: |
          echo "🚀 Deploying Web to staging..."
          az containerapp update \
            --name "ca-sport-staging-web" \
            --resource-group "${{ env.RESOURCE_GROUP_STAGING }}" \
            --image "${{ env.GHCR_REGISTRY }}/${{ needs.gate.outputs.repo_lowercase }}/web:${{ needs.gate.outputs.image_tag }}" \
            --output table
          echo "✅ Web updated to tag: ${{ needs.gate.outputs.image_tag }}"

      - name: Verify API Health
        shell: bash
        run: |
          echo "⏳ Waiting for API to become healthy..."
          API_FQDN=$(az containerapp show \
            --name "ca-sport-staging-api" \
            --resource-group "${{ env.RESOURCE_GROUP_STAGING }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "API URL: https://$API_FQDN"

          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$API_FQDN/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ API is healthy!"
              exit 0
            fi
            echo "  Attempt $i/12 — Status: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ API health check failed after 12 attempts"
          exit 1

      - name: Verify Web Health
        shell: bash
        run: |
          echo "⏳ Waiting for Web to become healthy..."
          WEB_FQDN=$(az containerapp show \
            --name "ca-sport-staging-web" \
            --resource-group "${{ env.RESOURCE_GROUP_STAGING }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Web URL: https://$WEB_FQDN"

          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$WEB_FQDN/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Web is healthy!"
              exit 0
            fi
            echo "  Attempt $i/12 — Status: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Web health check failed after 12 attempts"
          exit 1

      - name: Deployment Summary
        shell: bash
        run: |
          API_FQDN=$(az containerapp show \
            --name "ca-sport-staging-api" \
            --resource-group "${{ env.RESOURCE_GROUP_STAGING }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          WEB_FQDN=$(az containerapp show \
            --name "ca-sport-staging-web" \
            --resource-group "${{ env.RESOURCE_GROUP_STAGING }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Staging Deployment Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Branch:   ${{ needs.gate.outputs.head_branch }}"
          echo "  Commit:   ${{ needs.gate.outputs.head_sha }}"
          echo "  Image:    ${{ needs.gate.outputs.image_tag }}"
          echo "  API:      https://$API_FQDN"
          echo "  Web:      https://$WEB_FQDN"
          echo "  Swagger:  https://$API_FQDN/swagger"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ============================================================
  # PRODUCTION — master
  # ============================================================
  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.should_deploy == 'true' && needs.gate.outputs.environment == 'production'

    environment:
      name: production
      url: https://app.sporthub.app

    concurrency: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION || secrets.AZURE_CREDENTIALS }}

      - name: Deploy API — Update Container App
        shell: bash
        run: |
          echo "🚀 Deploying API to production..."
          az containerapp update \
            --name "ca-sport-prod-api" \
            --resource-group "${{ env.RESOURCE_GROUP_PRODUCTION }}" \
            --image "${{ env.GHCR_REGISTRY }}/${{ needs.gate.outputs.repo_lowercase }}/api:${{ needs.gate.outputs.image_tag }}" \
            --output table
          echo "✅ API updated to tag: ${{ needs.gate.outputs.image_tag }}"

      - name: Deploy Web — Update Container App
        shell: bash
        run: |
          echo "🚀 Deploying Web to production..."
          az containerapp update \
            --name "ca-sport-prod-web" \
            --resource-group "${{ env.RESOURCE_GROUP_PRODUCTION }}" \
            --image "${{ env.GHCR_REGISTRY }}/${{ needs.gate.outputs.repo_lowercase }}/web:${{ needs.gate.outputs.image_tag }}" \
            --output table
          echo "✅ Web updated to tag: ${{ needs.gate.outputs.image_tag }}"

      - name: Verify API Health
        shell: bash
        run: |
          echo "⏳ Waiting for API to become healthy..."
          API_FQDN=$(az containerapp show \
            --name "ca-sport-prod-api" \
            --resource-group "${{ env.RESOURCE_GROUP_PRODUCTION }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "API URL: https://$API_FQDN"

          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$API_FQDN/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ API is healthy!"
              exit 0
            fi
            echo "  Attempt $i/12 — Status: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ API health check failed after 12 attempts"
          exit 1

      - name: Verify Web Health
        shell: bash
        run: |
          echo "⏳ Waiting for Web to become healthy..."
          WEB_FQDN=$(az containerapp show \
            --name "ca-sport-prod-web" \
            --resource-group "${{ env.RESOURCE_GROUP_PRODUCTION }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Web URL: https://$WEB_FQDN"

          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$WEB_FQDN/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Web is healthy!"
              exit 0
            fi
            echo "  Attempt $i/12 — Status: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Web health check failed after 12 attempts"
          exit 1

      - name: Deployment Summary
        shell: bash
        run: |
          API_FQDN=$(az containerapp show \
            --name "ca-sport-prod-api" \
            --resource-group "${{ env.RESOURCE_GROUP_PRODUCTION }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          WEB_FQDN=$(az containerapp show \
            --name "ca-sport-prod-web" \
            --resource-group "${{ env.RESOURCE_GROUP_PRODUCTION }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Production Deployment Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Branch:   ${{ needs.gate.outputs.head_branch }}"
          echo "  Commit:   ${{ needs.gate.outputs.head_sha }}"
          echo "  Image:    ${{ needs.gate.outputs.image_tag }}"
          echo "  API:      https://$API_FQDN"
          echo "  Web:      https://$WEB_FQDN"
          echo "  Swagger:  https://$API_FQDN/swagger"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ============================================================
  # GitHub Release (solo producción)
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [gate, production]
    if: >
      needs.gate.outputs.should_deploy == 'true' &&
      needs.gate.outputs.environment == 'production' &&
      needs.production.result == 'success'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ needs.gate.outputs.head_sha }}
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          generate_release_notes: true
          draft: false
          prerelease: false
