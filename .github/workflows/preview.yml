# ============================================================
# SportHub Connect — Preview Environment per User Story
# ============================================================
# Crea/destruye entornos de preview por cada rama hu/*
# para que desarrolladores y QA puedan probar HUs en un
# entorno aislado con URL unica.
#
# Flujo:
#   Push a hu/*       → Crea preview (build + deploy)
#   PR opened/sync    → Actualiza preview
#   PR closed/merged  → Destruye preview
# ============================================================

name: Preview — HU Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [develop, 'feature/**']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name (e.g., hu/F001-US-001-mi-feature)'
        required: true
      action:
        description: 'Action: create or destroy'
        required: true
        default: 'create'

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  AZURE_RESOURCE_GROUP: rg-sporthub-staging
  REGISTRY: ghcr.io/${{ lower(github.repository) }}

jobs:
  # ============================================================
  # Determine action based on event
  # ============================================================
  determine-action:
    name: Determine Action
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.action.outputs.action }}
      branch_name: ${{ steps.action.outputs.branch_name }}
      safe_branch: ${{ steps.action.outputs.safe_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Determine action and branch
        id: action
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
            BRANCH="${{ github.event.inputs.branch }}"
          elif [[ "${{ github.event.action }}" == "closed" ]]; then
            echo "action=destroy" >> $GITHUB_OUTPUT
            BRANCH="${{ github.event.pull_request.head.ref }}"
          else
            echo "action=create" >> $GITHUB_OUTPUT
            BRANCH="${{ github.event.pull_request.head.ref }}"
          fi
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT
          
          # Convert branch name to safe container name
          SAFE=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | tr '[:upper:]' '[:lower:]')
          # Truncate to 32 chars for Azure naming limits
          SAFE="${SAFE:0:32}"
          # Remove trailing hyphens
          SAFE=$(echo "$SAFE" | sed 's/-$//')
          echo "safe_branch=$SAFE" >> $GITHUB_OUTPUT

  # ============================================================
  # Build & Push Images (only for create action)
  # ============================================================
  build-and-push:
    name: Build Images
    needs: determine-action
    if: needs.determine-action.outputs.action == 'create'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      safe_branch: ${{ needs.determine-action.outputs.safe_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        shell: bash
        run: |
          SAFE="${{ needs.determine-action.outputs.safe_branch }}"
          SHA="${GITHUB_SHA:0:7}"
          echo "tag=preview-${SAFE}-${SHA}" >> $GITHUB_OUTPUT
          echo "safe_branch=${SAFE}" >> $GITHUB_OUTPUT

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.api
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/api:preview-${{ steps.meta.outputs.safe_branch }}
            ${{ env.REGISTRY }}/api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: frontend/sport-hub-web
          file: frontend/sport-hub-web/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/web:preview-${{ steps.meta.outputs.safe_branch }}
            ${{ env.REGISTRY }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Deploy Preview to ACA
  # ============================================================
  deploy-preview:
    name: ${{ needs.determine-action.outputs.action == 'create' && '🚀 Deploy Preview' || '🗑️ Destroy Preview' }}
    needs: [determine-action, build-and-push]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.urls.outputs.web_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Preview
        if: needs.determine-action.outputs.action == 'create'
        id: deploy
        shell: pwsh
        env:
          SAFE_BRANCH: ${{ needs.determine-action.outputs.safe_branch }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          .\infrastructure\deploy-preview.ps1 `
            -Action create `
            -BranchName "$env:SAFE_BRANCH" `
            -ImageTag "$env:IMAGE_TAG" `
            -ResourceGroup "${{ env.AZURE_RESOURCE_GROUP }}" `
            -Verbose

      - name: Destroy Preview
        if: needs.determine-action.outputs.action == 'destroy'
        shell: pwsh
        env:
          SAFE_BRANCH: ${{ needs.determine-action.outputs.safe_branch }}
        run: |
          .\infrastructure\deploy-preview.ps1 `
            -Action destroy `
            -BranchName "$env:SAFE_BRANCH" `
            -ResourceGroup "${{ env.AZURE_RESOURCE_GROUP }}" `
            -Verbose

      - name: Get Preview URLs
        id: urls
        if: needs.determine-action.outputs.action == 'create'
        shell: bash
        run: |
          SAFE="${{ needs.determine-action.outputs.safe_branch }}"
          RG="${{ env.AZURE_RESOURCE_GROUP }}"

          # Get FQDNs from ACA
          API_FQDN=$(az containerapp show \
            --name "ca-preview-${SAFE}-api" \
            --resource-group "$RG" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "unknown")
          
          WEB_FQDN=$(az containerapp show \
            --name "ca-preview-${SAFE}-web" \
            --resource-group "$RG" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "unknown")

          echo "api_url=https://${API_FQDN}" >> $GITHUB_OUTPUT
          echo "web_url=https://${WEB_FQDN}" >> $GITHUB_OUTPUT

      - name: Wait for API Health
        if: needs.determine-action.outputs.action == 'create'
        shell: bash
        run: |
          SAFE="${{ needs.determine-action.outputs.safe_branch }}"
          echo "⏳ Waiting for preview API to become healthy..."
          
          for i in {1..18}; do
            URL="https://ca-preview-${SAFE}-api.$(az containerapp show \
              --name ca-preview-${SAFE}-api \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query 'properties.configuration.ingress.fqdn' -o tsv)/health"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Preview API is healthy!"
              exit 0
            fi
            echo "  Attempt $i/18 — Status: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Preview API health check failed"
          exit 1

      - name: Wait for Web Health
        if: needs.determine-action.outputs.action == 'create'
        shell: bash
        run: |
          SAFE="${{ needs.determine-action.outputs.safe_branch }}"
          echo "⏳ Waiting for preview Web to become healthy..."
          
          for i in {1..18}; do
            URL="https://ca-preview-${SAFE}-web.$(az containerapp show \
              --name ca-preview-${SAFE}-web \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query 'properties.configuration.ingress.fqdn' -o tsv)/api/health"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Preview Web is healthy!"
              exit 0
            fi
            echo "  Attempt $i/18 — Status: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Preview Web health check failed"
          exit 1

  # ============================================================
  # Comment Preview URL on PR
  # ============================================================
  comment-pr:
    name: Comment PR
    needs: [determine-action, deploy-preview]
    if: >
      always() && !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.determine-action.outputs.action == 'create'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Get URLs
        id: urls
        shell: bash
        run: |
          SAFE="${{ needs.determine-action.outputs.safe_branch }}"
          RG="${{ env.AZURE_RESOURCE_GROUP }}"

          API_FQDN=$(az containerapp show \
            --name "ca-preview-${SAFE}-api" \
            --resource-group "$RG" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "not found")
          WEB_FQDN=$(az containerapp show \
            --name "ca-preview-${SAFE}-web" \
            --resource-group "$RG" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "not found")

          echo "api_url=https://${API_FQDN}" >> $GITHUB_OUTPUT
          echo "web_url=https://${WEB_FQDN}" >> $GITHUB_OUTPUT

      - name: Find existing comment
        id: find_comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## 🚀 Preview Environment'

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚀 Preview Environment

            | Service | URL |
            |---------|-----|
            | **API** | [${{ steps.urls.outputs.api_url }}](${{ steps.urls.outputs.api_url }}) |
            | **Web** | [${{ steps.urls.outputs.web_url }}](${{ steps.urls.outputs.web_url }}) |
            | **Swagger** | [${{ steps.urls.outputs.api_url }}/swagger](${{ steps.urls.outputs.api_url }}/swagger) |

            | Detail | Value |
            |--------|-------|
            | Branch | `${{ needs.determine-action.outputs.branch_name }}` |
            | Image Tag | `${{ needs.build-and-push.outputs.image_tag }}` |
            | Status | ✅ **Ready** |

            > ⚠️ This environment will be **automatically destroyed** when the PR is closed/merged.
