name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"

jobs:
  # ============================================================
  # Build & Push Docker Images
  # ============================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
          echo "tag=staging-$((Get-Date).ToString('yyyyMMdd-HHmmss'))" >> $env:GITHUB_OUTPUT

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.api
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:staging
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: frontend/sport-hub-web
          file: frontend/sport-hub-web/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:staging
            ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Deploy to Staging Environment
  # ============================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.sporthub.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Container Apps
        run: |
          echo "Deploying to Azure Container Apps - staging environment"
          # az containerapp update --name sporthub-api-staging \
          #   --resource-group sporthub-staging-rg \
          #   --image ghcr.io/${{ github.repository }}/api:staging
          # az containerapp update --name sporthub-web-staging \
          #   --resource-group sporthub-staging-rg \
          #   --image ghcr.io/${{ github.repository }}/web:staging
