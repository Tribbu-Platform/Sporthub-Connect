name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Specific image tag to deploy (default: staging)'
        required: false
        default: 'staging'

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  AZURE_RESOURCE_GROUP: rg-sporthub-staging
  CONTAINER_APP_API: ca-sport-staging-api
  CONTAINER_APP_WEB: ca-sport-staging-web
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  # ============================================================
  # Build & Push Docker Images
  # ============================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        shell: pwsh
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
          echo "tag=staging-$((Get-Date).ToString('yyyyMMdd-HHmmss'))" >> $env:GITHUB_OUTPUT

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.api
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/api:staging
            ${{ env.REGISTRY }}/api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: frontend/sport-hub-web
          file: frontend/sport-hub-web/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/web:staging
            ${{ env.REGISTRY }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

  # ============================================================
  # Deploy to Azure Container Apps
  # ============================================================
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://ca-sport-staging-api.<CHANGE_TO_YOUR_REGION>.azurecontainerapps.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API Container
        shell: bash
        run: |
          echo "🚀 Deploying API to staging..."
          az containerapp update \
            --name ${{ env.CONTAINER_APP_API }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/api:${{ github.event.inputs.image_tag || 'staging' }} \
            --output table

      - name: Deploy Web Container
        shell: bash
        run: |
          echo "🚀 Deploying Web to staging..."
          az containerapp update \
            --name ${{ env.CONTAINER_APP_WEB }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/web:${{ github.event.inputs.image_tag || 'staging' }} \
            --output table

      - name: Verify API Health
        shell: bash
        run: |
          echo "⏳ Waiting for API to become healthy..."
          API_FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_API }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "API URL: https://$API_FQDN"
          
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$API_FQDN/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ API is healthy!"
              exit 0
            fi
            echo "  Attempt $i/12 — Status: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ API health check failed after 12 attempts"
          exit 1

      - name: Verify Web Health
        shell: bash
        run: |
          echo "⏳ Waiting for Web to become healthy..."
          WEB_FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_WEB }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Web URL: https://$WEB_FQDN"
          
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$WEB_FQDN/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Web is healthy!"
              exit 0
            fi
            echo "  Attempt $i/12 — Status: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Web health check failed after 12 attempts"
          exit 1

      - name: Deployment Summary
        shell: bash
        run: |
          API_FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_API }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          WEB_FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_WEB }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Staging Deployment Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  API:   https://$API_FQDN"
          echo "  Web:   https://$WEB_FQDN"
          echo "  Swagger: https://$API_FQDN/swagger"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
